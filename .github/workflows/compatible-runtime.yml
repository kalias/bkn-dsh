name: compatible-runtime

on:
  workflow_dispatch:
  push:
    tags: ["openbkn-dsh-runtime-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    env:
      PLUGIN_ARTIFACT: openbkn-dsh-business-context-0.1.4.tgz
      BUNDLE_NAME: openbkn-dsh-runtime-0.1.6-alpha.2-openbkn.1
    steps:
      - uses: actions/checkout@v4
      - name: Preserve repository LF patch bytes
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git checkout -- .
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Checkout pinned DSH source
        run: git clone --depth 1 --branch dsh-v0.1.6-alpha.2 https://github.com/deepseek-ai/deepseek-harness.git release/deepseek-harness
      - name: Point generator override at pinned DSH source
        run: node scripts/configure-pinned-dsh-generator.mjs --dsh release/deepseek-harness
      - name: Install bkn-dsh dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify compatibility series on a clean pinned tree
        # bash so a failed verify cannot hide behind a successful revert
        shell: bash
        run: |
          set -euo pipefail
          node compat/dsh-0.1.6-alpha.2/apply.mjs --dsh release/deepseek-harness
          node compat/dsh-0.1.6-alpha.2/verify.mjs --dsh release/deepseek-harness
          node compat/dsh-0.1.6-alpha.2/apply.mjs --dsh release/deepseek-harness --revert
      - name: Build compatible DSH runtime
        run: pnpm runtime:build -- --dsh release/deepseek-harness --output release/runtime
      - name: Test plugin and compatibility tooling
        # bash so every command's failure fails the step; pwsh would exit on
        # the LAST native command's code and swallow a mid-block failure
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @openbkn/dsh-business-context test
          node --test compat/dsh-0.1.6-alpha.2/tests/*.test.mjs tests/*.test.mjs runtime/tests/*.test.mjs
          pnpm run package:check
      - name: Build and pack bkn-dsh
        # bash so a failed build cannot hide behind a successful pack
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @openbkn/dsh-business-context build
          pnpm --filter @openbkn/dsh-business-context pack --pack-destination release/plugin
      - name: Prepare DSH-native Web profile
        run: pnpm runtime:profile -- --runtime release/runtime --plugin "release/plugin/$PLUGIN_ARTIFACT" --output release/profile
      - name: Package runtime archive
        run: pnpm runtime:package -- --runtime release/runtime --profile release/profile --plugin "release/plugin/$PLUGIN_ARTIFACT" --output release/artifacts --platform ${{ matrix.platform }}
      - name: Check runtime portability
        run: node scripts/check-runtime-portability.mjs --output release/artifacts --platform ${{ matrix.platform }}
      - name: Smoke-test the assembled runtime entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bundle="release/artifacts/$BUNDLE_NAME-${{ matrix.platform }}"
          if [[ "${{ matrix.platform }}" == win32-x64 ]]; then
            # drive the real launcher: --version goes straight to the run label,
            # and cmd.exe /c is non-interactive, so the guard/bootstrap paths stay unexercised-but-honest
            version="$(cmd.exe /c "$bundle\\bin\\dsh.cmd" --version | tr -d '\r')"
          else
            version="$(OPENBKN_DSH_HOME="$(mktemp -d)" "$bundle/bin/dsh" --version)"
          fi
          echo "entrypoint reported: $version"
          grep -q "0.1.6-alpha.2" <<< "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: openbkn-dsh-runtime-${{ matrix.platform }}
          path: release/artifacts/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/openbkn-dsh-runtime-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
